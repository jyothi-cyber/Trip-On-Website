<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Trip On Admin</title>
    <link rel="stylesheet" href="admin-styles.css?v=20260820">
    <link rel="stylesheet" href="admin-profile-styles.css?v=20260820">
</head>

<body>
    <!-- Mobile Header -->
    <header class="mobile-header">
        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
        </button>
        <div class="mobile-menu-dropdown" id="mobileMenuDropdown">
            <a href="admin-dashboard.html" class="mobile-menu-item" id="mobileMenuLeads">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                    <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5" />
                    <line x1="3" y1="8" x2="17" y2="8" stroke="currentColor" stroke-width="1.5" />
                    <line x1="8" y1="8" x2="8" y2="17" stroke="currentColor" stroke-width="1.5" />
                </svg>
                <span>Leads</span>
            </a>
            <a href="admin-packages.html" class="mobile-menu-item" id="mobileMenuPackages">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                    <path d="M10 2L3 6v7c0 4.5 7 7 7 7s7-2.5 7-7V6l-7-4z" stroke="currentColor" stroke-width="1.5" fill="none" />
                </svg>
                <span>Packages</span>
            </a>
            <div class="mobile-menu-divider"></div>
            <button class="mobile-menu-item" onclick="mobileLogout()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M15 4h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-2M10 17l5-5-5-5M15 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Logout</span>
            </button>
        </div>
        <img src="../assets/images/tripon-logo.png" alt="Trip On Logo" class="mobile-logo">
        <div class="mobile-user-avatar" id="mobileProfileBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="8" r="4" fill="currentColor" />
                <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7" fill="currentColor" />
            </svg>
        </div>
    </header>

    <!-- Sidebar Overlay (for mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="dashboard-layout">
        <!-- Left Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../assets/images/tripon-logo.png" alt="Trip On Logo" class="sidebar-logo">
                <button class="menu-toggle" id="menuToggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" />
                        <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" />
                        <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" />
                    </svg>
                </button>
            </div>
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5" />
                        <line x1="3" y1="8" x2="17" y2="8" stroke="currentColor" stroke-width="1.5" />
                        <line x1="8" y1="8" x2="8" y2="17" stroke="currentColor" stroke-width="1.5" />
                    </svg>
                    <span>Leads</span>
                </a>
                <a href="admin-packages.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 2L3 6v7c0 4.5 7 7 7 7s7-2.5 7-7V6l-7-4z" stroke="currentColor" stroke-width="1.5" fill="none" />
                    </svg>
                    <span>Packages</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Navigation Bar -->
            <header class="top-header">
                <button class="top-menu-btn" id="topMenuBtn" title="Toggle sidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
                <div class="header-right">
                    <a href="admin-dashboard.html" class="header-back-btn" title="Back to Dashboard">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>
                    <div class="user-profile">
                        <div class="user-avatar" id="userAvatar">DJ</div>
                    </div>
                </div>
            </header>

            <!-- Profile Content -->
            <div class="profile-page">
                <!-- Profile Header Card -->
                <div class="profile-card">
                    <div class="profile-banner"></div>
                    <div class="profile-info">
                        <div class="profile-avatar">DJ</div>
                        <div class="profile-name-row">
                            <h1 class="profile-name">Duddukunta Jyothi</h1>
                            <span class="profile-badge">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" stroke-width="2" fill="none"/>
                                </svg>
                                ADMIN
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Personal Info Card -->
                <div class="profile-info-card">
                    <div class="profile-info-header">
                        <h2>Personal info</h2>
                        <button class="profile-edit-btn" id="editProfileBtn" onclick="toggleEditProfile()">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                                <path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" stroke="currentColor" stroke-width="2" fill="none"/>
                            </svg>
                            Edit
                        </button>
                    </div>
                    <div class="profile-info-divider"></div>

                    <!-- Full Name -->
                    <div class="profile-field">
                        <label class="profile-field-label">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
                                <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="2" fill="none"/>
                            </svg>
                            FULL NAME
                        </label>
                        <input type="text" class="profile-field-input" id="profileName" value="Duddukunta Jyothi" readonly>
                    </div>

                    <!-- Email -->
                    <div class="profile-field">
                        <label class="profile-field-label">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                                <rect x="2" y="4" width="20" height="16" rx="3" stroke="currentColor" stroke-width="2" fill="none"/>
                                <path d="M2 7l10 6 10-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            EMAIL
                        </label>
                        <input type="email" class="profile-field-input" id="profileEmail" value="jyothi@vedaadventures.org" readonly>
                        <span class="profile-field-hint">Contact admin to change your email.</span>
                    </div>

                    <!-- Phone -->
                    <div class="profile-field">
                        <label class="profile-field-label">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" stroke="currentColor" stroke-width="2" fill="none"/>
                            </svg>
                            PHONE
                        </label>
                        <input type="tel" class="profile-field-input profile-field-placeholder" id="profilePhone" placeholder="Add phone number" readonly>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div class="toast-notification" id="toastNotification">
        <span class="toast-icon">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M13.5 4L6.5 11L2.5 7" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </span>
        <span class="toast-message" id="toastMessage">Copied!</span>
    </div>

    <script>
    function toggleEditProfile() {
        var nameInput = document.getElementById('profileName');
        var phoneInput = document.getElementById('profilePhone');
        var editBtn = document.getElementById('editProfileBtn');
        var isReadonly = nameInput.hasAttribute('readonly');
        if (isReadonly) {
            nameInput.removeAttribute('readonly');
            phoneInput.removeAttribute('readonly');
            nameInput.style.background = '#FFFFFF';
            nameInput.style.border = '1px solid #D9E0E8';
            phoneInput.style.background = '#FFFFFF';
            phoneInput.style.border = '1px solid #D9E0E8';
            editBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Save';
            editBtn.classList.add('saving');
            nameInput.focus();
        } else {
            nameInput.setAttribute('readonly', true);
            phoneInput.setAttribute('readonly', true);
            nameInput.style.background = '#F4F5F7';
            nameInput.style.border = 'none';
            phoneInput.style.background = '#F4F5F7';
            phoneInput.style.border = 'none';
            editBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" stroke="currentColor" stroke-width="2" fill="none"/></svg> Edit';
            editBtn.classList.remove('saving');
            showToast('Profile updated');
        }
    }
    function showToast(msg) {
        var t = document.getElementById('toastNotification');
        var m = document.getElementById('toastMessage');
        if (t && m) { m.textContent = msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 2200); }
    }
    function mobileLogout() { window.location.href = 'admin-login.html'; }
    function logoutAdmin() { window.location.href = 'admin-login.html'; }

    // Mobile menu toggle
    document.addEventListener('DOMContentLoaded', function() {
        var menuBtn = document.getElementById('mobileMenuBtn');
        var dropdown = document.getElementById('mobileMenuDropdown');
        if (menuBtn && dropdown) {
            menuBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                dropdown.classList.toggle('open');
            });
        }
        document.addEventListener('click', function(e) {
            if (dropdown && !e.target.closest('.mobile-header')) {
                dropdown.classList.remove('open');
            }
        });
        var topMenuBtn = document.getElementById('topMenuBtn');
        if (topMenuBtn) topMenuBtn.addEventListener('click', function() {
            var sb = document.getElementById('sidebar');
            if (sb) sb.classList.toggle('collapsed');
        });
    });
    </script>
</body>

</html>
