<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packages - Trip On Admin</title>
    <link rel="stylesheet" href="admin-styles.css">
    <link rel="stylesheet" href="admin-packages-styles.css">
</head>
<body>
    <!-- Mobile Header -->
    <header class="mobile-header">
        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        <img src="../assets/images/tripon-logo.png" alt="Trip On Logo" class="mobile-logo">
        <div class="mobile-user-avatar" id="mobileProfileBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="8" r="4" fill="currentColor"/>
                <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7" fill="currentColor"/>
            </svg>
        </div>
    </header>

    <!-- Sidebar Overlay (for mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="dashboard-layout">
        <!-- Left Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="menu-toggle" id="menuToggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2"/>
                        <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2"/>
                        <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </button>
            </div>
            
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="3" y1="8" x2="17" y2="8" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="8" y1="8" x2="8" y2="17" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span>Leads</span>
                </a>
                <a href="admin-packages.html" class="nav-item active">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 2L3 6v7c0 4.5 7 7 7 7s7-2.5 7-7V6l-7-4z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    </svg>
                    <span>Packages</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <h1 class="page-title">Packages</h1>
                <div class="header-right">
                    <div class="user-profile">
                        <div class="user-avatar">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="8" r="4" fill="currentColor"/>
                                <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7" fill="currentColor"/>
                            </svg>
                        </div>
                        <span class="user-name">Admin</span>
                    </div>
                </div>
            </header>

            <!-- Packages Navigation Tabs -->
            <div class="packages-tabs">
                <button class="tab-btn active" data-tab="all" onclick="switchTab('all')">
                    All Packages
                </button>
                <button class="tab-btn" data-tab="popular" onclick="switchTab('popular')">
                    Popular Packages
                </button>
            </div>

            <!-- ALL PACKAGES VIEW -->
            <div class="packages-view" id="allPackagesView">
                <!-- Standard Packages Section -->
                <div class="packages-section">
                    <h2 class="section-title">Standard Packages</h2>
                    <div class="duration-filters">
                        <button class="duration-btn active" data-duration="all" onclick="filterByDuration('all')">All</button>
                        <button class="duration-btn" data-duration="4" onclick="filterByDuration('4')">4N5D</button>
                        <button class="duration-btn" data-duration="5" onclick="filterByDuration('5')">5N6D</button>
                        <button class="duration-btn" data-duration="6" onclick="filterByDuration('6')">6N7D</button>
                        <button class="duration-btn" data-duration="7" onclick="filterByDuration('7')">7N8D</button>
                    </div>

                    <div class="packages-category-grid">
                        <div class="category-card" onclick="navigateToPackageType('economy')">
                            <div class="category-icon">💰</div>
                            <h3>Economy</h3>
                        </div>
                        <div class="category-card" onclick="navigateToPackageType('luxury')">
                            <div class="category-icon">✨</div>
                            <h3>Luxury</h3>
                        </div>
                        <div class="category-card" onclick="navigateToPackageType('delight')">
                            <div class="category-icon">🎉</div>
                            <h3>Delight</h3>
                        </div>
                        <div class="category-card" onclick="navigateToPackageType('classic')">
                            <div class="category-icon">🏛️</div>
                            <h3>Classic</h3>
                        </div>
                    </div>

                    <div class="packages-category-grid" style="margin-top: 20px;">
                        <div class="category-card" onclick="navigateToPackageType('premium')">
                            <div class="category-icon">💎</div>
                            <h3>Premium</h3>
                        </div>
                        <div class="category-card" onclick="navigateToPackageType('elite')">
                            <div class="category-icon">👑</div>
                            <h3>Elite</h3>
                        </div>
                        <div class="category-card" onclick="navigateToPackageType('custom')">
                            <div class="category-icon">⚙️</div>
                            <h3>Custom Packages</h3>
                        </div>
                    </div>
                </div>

                <!-- Add Package Button -->
                <div class="add-package-section">
                    <button class="btn-add-package" onclick="openAddPackageModal()">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <line x1="10" y1="4" x2="10" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <line x1="4" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        Add Package
                    </button>
                </div>
            </div>

            <!-- POPULAR PACKAGES VIEW -->
            <div class="packages-view" id="popularPackagesView" style="display: none;">
                <div class="popular-info-banner">
                    <p>The Popular packages are Updated on a challenge, for those who have the Most packages with more than 1Lakhs budget here.</p>
                </div>

                <div class="popular-packages-grid" id="popularPackagesGrid">
                    <!-- Popular packages will be dynamically loaded here -->
                </div>
            </div>
        </main>
    </div>

    <script src="js/packages-data.js"></script>
    <script src="js/admin-packages.js"></script>
</body>
</html>
